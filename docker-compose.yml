services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    ports:
      - "8191:8191"
    environment:
      - LOG_LEVEL=info
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
      - TZ=America/Sao_Paulo

  mibr-indexer:
    image: mibr-indexer:latest
    build:
      context: ./indexer
      dockerfile: Dockerfile
    container_name: mibr-indexer
    restart: unless-stopped
    ports:
      - "7001:7001"
    depends_on:
      - flaresolverr
    environment:
      PORT: 7001
      NODE_ENV: production
      FLARESOLVERR_URL: http://flaresolverr:8191
      BLUDV_SITE_URL: https://bludvfilmes.xyz
      TORRENTDOSFILMES_SITE_URL: https://torrentdosfilmes2.site
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7001/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  mibr-addons:
    image: mibr-addons:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mibr-addons
    restart: unless-stopped
    ports:
      - "7000:7000"
    depends_on:
      - mibr-indexer
    environment:
      PORT: 7000
      NODE_ENV: production
      REALDEBRID_TOKEN: ${REALDEBRID_TOKEN:-}
      STREAM_CACHE_TTL_SECONDS: ${STREAM_CACHE_TTL_SECONDS:-300}
      STREAM_CACHE_MAX_ENTRIES: ${STREAM_CACHE_MAX_ENTRIES:-500}
      BLUDV_BASE_URL: http://mibr-indexer:7001
      TORRENTDOSFILMES_BASE_URL: http://mibr-indexer:7001
      # TORRENTIO_BASE_URL: by default omitted so it hits https://torrentio.strem.fun
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7000/manifest.json"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
