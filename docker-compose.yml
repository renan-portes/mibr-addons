services:
  mibr-tv:
    image: mibr-tv:latest
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: build
    container_name: mibr-tv
    restart: unless-stopped
    ports:
      - "7000:7000"
    # volumes:
    #   - ./data:/app/data:ro
    environment:
      PORT: 7000
      NODE_ENV: production
      CHANNELS_M3U_PATH: /app/data/channels.m3u
      CHANNELS_M3U_URL: ${CHANNELS_M3U_URL:-}
      STREAM_CACHE_TTL_SECONDS: ${STREAM_CACHE_TTL_SECONDS:-300}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7000/manifest.json"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 3
