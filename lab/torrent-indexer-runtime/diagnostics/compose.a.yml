services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.3.21
    restart: "no"
    shm_size: 128m
    networks:
      - diagnostic
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8191/', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
